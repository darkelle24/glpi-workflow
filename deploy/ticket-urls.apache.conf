# Inside the existing GLPI VirtualHost or public/.htaccess, BEFORE the GLPI fallback.
# Requires mod_rewrite. This example assumes GLPI is hosted at /.
# RewriteRule patterns have no leading slash in .htaccess.
RewriteEngine On
RewriteRule ^/?front/ticket/([1-9][0-9]*)/([a-z0-9-]+)/?$ /plugins/workflowbuilder/front/ticket-tabs.php?id=$1&tab=$2 [L]
# Inside the existing GLPI server block, BEFORE the generic location /.
# This example assumes GLPI is hosted at /. For /glpi, prefix both paths with /glpi.
# GLPI's existing PHP/front-controller configuration must remain in place.
location ~ ^/front/ticket/([1-9][0-9]*)/([a-z0-9-]+)/?$ {
    rewrite ^/front/ticket/([1-9][0-9]*)/([a-z0-9-]+)/?$ /plugins/workflowbuilder/front/ticket-tabs.php?id=$1&tab=$2? last;
}